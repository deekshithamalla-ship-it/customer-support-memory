<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support That Remembers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Customer Support That Remembers</h1>
            <p>AI-powered customer support with long-term memory</p>
        </header>

        <main>
            <div id="chat-box" class="chat-box">
                <div class="message system">
                    Welcome to Customer Support! How can we help you today?
                </div>
            </div>

            <form id="chat-form" class="chat-form">
                <input type="text" id="user-input" placeholder="Type your message here..." required autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
